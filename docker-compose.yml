version: '3.8'

services:
  gemini-proxy:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gemini-proxy
    ports:
      - "3002:3002"
    volumes:
      # 掛載本機的 ./backend/data 目錄以持久化儲存 SQLite 資料庫
      # 校正：Container 內預設工作目錄為 /app/backend
      - ./backend/data:/app/backend/data
      # 掛載登入所需的設定檔 (保留作為傳統驗證備援)
      - ./gemini-config:/root/.gemini
    environment:
      - PORT=3002
      - DATABASE_PATH=./data/api_keys.db
      - JWT_SECRET=your-secure-jwt-secret-here
      - ROOT_USER=admin
      - ROOT_PASSWORD=admin
      - LOG_LEVEL=info
    restart: unless-stopped
