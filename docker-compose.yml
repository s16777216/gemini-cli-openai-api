version: '3.8'

services:
  gemini-proxy:
    build: .
    container_name: gemini-proxy
    ports:
      - "3000:3000"
    volumes:
      # 掛載本機的 ./data 目錄以持久化儲存 SQLite 資料庫
      - ./data:/app/data
      # 掛載登入所需的設定檔。gemini-cli 在 Linux 上預設儲存於 ~/.config/configstore
      # 將其掛載到本機，使得重新建立 container 不會遺失登入狀態
      - ./gemini-config:/root/.config/configstore
    environment:
      - PORT=3000
      - DATABASE_PATH=./data/api_keys.db
      - LOG_LEVEL=info
    restart: unless-stopped
